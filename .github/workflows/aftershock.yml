# Dogfooding: this project reports the blast radius of its own pull requests.
name: Blast radius

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write      # to post the report as a comment

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the report compares against the base branch, so it needs history
      - uses: ./              # the action in this repository (action.yml)
        with:
          trace: "true"
          install: pip install -r requirements.txt
