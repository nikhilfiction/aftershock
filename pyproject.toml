[project]
name = "aftershock"
version = "1.0.0"
description = "See the blast radius of a code change in Python, JavaScript and TypeScript before you merge"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "redis>=5.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "httpx>=0.27", "fakeredis>=2.26"]

[project.scripts]
aftershock = "aftershock.cli:main"

[tool.setuptools.packages.find]
include = ["aftershock*"]

[tool.setuptools.package-data]
# the built web app (cd ui && npm run build), served at / by `aftershock serve`
aftershock = ["web/*", "web/**/*", "js/*.cjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
